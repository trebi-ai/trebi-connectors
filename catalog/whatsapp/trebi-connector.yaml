schema: trebi-connector/1
name: whatsapp
title: WhatsApp
description: "Send and receive WhatsApp messages from your own account."
version: 0.7.0
publisher: trebi
source: github.com/trebi-ai/trebi-connectors
license: MIT
warning: "Uses the WhatsApp Web protocol. WhatsApp can ban an account that uses it. Use a number that you can lose."
platforms: [darwin/arm64, darwin/amd64, linux/arm64, linux/amd64]
install:
  catalog: true
  bin: whatsapp-cli
  version_command: whatsapp-cli --version
setup:
  login: [qr]
  inputs:
    - name: WA_DEVICE_NAME
      label: Device name
      help: The name that your phone shows in Linked devices.
      required: false
actions:
  cli: {commands: [whatsapp-cli]}
events:
  protocol: trebi-connector/1
  command: whatsapp-cli serve
  restart: always
  types:
    - {type: message, description: A new message in a room, schema: schemas/message.json}
    - {type: reaction, description: A reaction on a message, schema: schemas/reaction.json}
channel:
  features: [rooms.list, rooms.open, history, replay, typing, seen, reactions, attachments.in, attachments.out]
  limits: {max_text: 65536, formats: [text]}
