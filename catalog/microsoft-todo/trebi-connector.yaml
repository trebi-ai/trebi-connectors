schema: trebi-connector/1
name: microsoft-todo
title: Microsoft To Do
description: "Start work when a task changes in a Microsoft To Do list. Read and change lists, tasks, steps, links, files, and extensions."
version: 0.2.0
publisher: trebi
source: github.com/trebi-ai/trebi-connectors
license: MIT
platforms: [darwin/arm64, darwin/amd64, linux/arm64, linux/amd64]
install:
  catalog: true
  bin: microsoft-todo-cli
  version_command: microsoft-todo-cli --version
setup:
  login: [device_code]
  inputs:
    - name: MICROSOFT_TODO_CLIENT_ID
      label: "Microsoft app id"
      help: "Optional. The application (client) id of your own Entra app, with public client flows on. Without it, the app of Trebi logs in."
      url: "https://entra.microsoft.com/#view/Microsoft_AAD_RegisteredApps/ApplicationsListBlade"
    - name: MICROSOFT_TODO_TENANT
      label: "Microsoft tenant"
      help: "Optional. Use consumers for an app that accepts only personal Microsoft accounts, organizations for work accounts only, or a tenant id."
      default: "common"
actions:
  cli: {commands: [microsoft-todo-cli]}
events:
  protocol: trebi-connector/1
  command: microsoft-todo-cli serve
  restart: always
  types:
    - {type: task, description: "A task created, changed, or deleted in a list", schema: schemas/task.json}
  subscriptions:
    action: Watch a list
    modes: [api, poll]
    fields:
      - name: list
        label: List
        dynamic: true
        required: true
        room: true
    webhook:
      handshake: ["query_echo:validationToken"]
