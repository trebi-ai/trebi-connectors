schema: trebi-connector/1
name: hightouch
title: "Hightouch"
description: "List and run Hightouch syncs, and read their run history."
version: 0.1.0
publisher: trebi
setup:
  inputs:
    - name: HIGHTOUCH_API_KEY
      label: "API key"
      help: "Create an API key in Hightouch under Settings, API keys."
      url: "https://app.hightouch.com/settings/api-keys"
      secret: true
      required: true
actions:
  cli: {commands: [hightouch-cli]}
