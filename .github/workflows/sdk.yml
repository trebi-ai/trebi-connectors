name: sdk

on:
  pull_request:
    paths:
      - "sdk/**"
      - "connectors/**"
      - "go.work"
      - "scripts/changed.sh"
      - ".github/workflows/sdk.yml"
  push:
    branches: [main]
    paths:
      - "sdk/**"
      - "connectors/**"
      - "go.work"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Picks what to test. A change in the SDK, go.work, or this workflow tests
  # the SDK and every CLI. A change in connectors/<cli>/ tests that CLI only.
  changes:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    outputs:
      sdk: ${{ steps.pick.outputs.sdk }}
      clis: ${{ steps.pick.outputs.clis }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          # The build tags of each CLI that needs them.
          TAGS: '{"whatsapp-cli": "sqlite_fts5"}'
        run: |
          set -euo pipefail
          changed="$(scripts/changed.sh "$BASE")"
          all=false
          if grep -qE '^(\*$|sdk/|go\.work|scripts/changed\.sh|\.github/workflows/sdk\.yml)' <<<"$changed"; then
            all=true
          fi
          clis=()
          for dir in connectors/*/; do
            cli="$(basename "$dir")"
            if [ "$all" = true ] || grep -q "^connectors/$cli/" <<<"$changed"; then
              clis+=("$cli")
            fi
          done
          json="$(printf '%s\n' ${clis[@]+"${clis[@]}"} | jq -Rnc --argjson tags "$TAGS" \
            '[inputs | select(. != "") | {cli: ., tags: ($tags[.] // "")}]')"
          echo "sdk=$all" >> "$GITHUB_OUTPUT"
          echo "clis=$json" >> "$GITHUB_OUTPUT"
          echo "sdk: $all"
          echo "clis: $json"

  sdk:
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go.mod
          cache: false
      - name: Test the SDK
        working-directory: sdk
        env:
          GOWORK: "off"
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test -race ./...

  # Builds and tests each picked CLI against the SDK in the same commit,
  # through go.work.
  channels:
    needs: changes
    if: needs.changes.outputs.clis != '[]'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.clis) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: connectors/${{ matrix.cli }}/go.mod
          cache: false
      - name: Build, vet, and test
        working-directory: connectors/${{ matrix.cli }}
        env:
          CGO_ENABLED: "1"
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go build -tags "${{ matrix.tags }}" ./...
          go vet -tags "${{ matrix.tags }}" ./...
          go test -race -tags "${{ matrix.tags }}" ./...
      # go install ignores go.work and takes the SDK tag in go.mod. Before
      # the SDK change is tagged and the require is bumped, this step fails
      # on a PR as a warning only.
      - name: Build without the workspace
        working-directory: connectors/${{ matrix.cli }}
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        env:
          GOWORK: "off"
          CGO_ENABLED: "1"
        run: go build -tags "${{ matrix.tags }}" ./...
