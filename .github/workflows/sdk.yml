name: sdk

on:
  pull_request:
    paths:
      - "sdk/**"
      - "connectors/**"
      - "go.work"
      - ".github/workflows/sdk.yml"
  push:
    branches: [main]
    paths:
      - "sdk/**"
      - "connectors/**"

permissions:
  contents: read

jobs:
  sdk:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go.mod
          cache: false
      - name: Test the SDK
        working-directory: sdk
        env:
          GOWORK: "off"
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test -race ./...

  # A change in the SDK rebuilds and tests every channel CLI against the SDK
  # in the same commit, through go.work.
  channels:
    runs-on: [self-hosted, Linux, X64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - cli: discord-cli
            tags: ""
          - cli: whatsapp-cli
            tags: sqlite_fts5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: connectors/${{ matrix.cli }}/go.mod
          cache: false
      - name: Build, vet, and test
        working-directory: connectors/${{ matrix.cli }}
        env:
          CGO_ENABLED: "1"
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go build -tags "${{ matrix.tags }}" ./...
          go vet -tags "${{ matrix.tags }}" ./...
          go test -race -tags "${{ matrix.tags }}" ./...
      # go install ignores go.work and takes the SDK tag in go.mod. Before
      # the SDK change is tagged and the require is bumped, this step fails
      # on a PR as a warning only.
      - name: Build without the workspace
        working-directory: connectors/${{ matrix.cli }}
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        env:
          GOWORK: "off"
          CGO_ENABLED: "1"
        run: go build -tags "${{ matrix.tags }}" ./...
