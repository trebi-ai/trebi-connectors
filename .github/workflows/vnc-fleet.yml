name: vnc-fleet

# Runs the vnc-cli fleet tests against the VNC servers of
# connectors/vnc-cli/fleet/docker-compose.yml.
on:
  pull_request:
    paths:
      - "connectors/vnc-cli/**"
      - ".github/workflows/vnc-fleet.yml"
  push:
    branches: [main]
    paths:
      - "connectors/vnc-cli/**"
      - ".github/workflows/vnc-fleet.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fleet:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    defaults:
      run:
        working-directory: connectors/vnc-cli
    env:
      # One compose project per run, so that no other job shares the
      # containers.
      VNC_FLEET_PROJECT: vnc-cli-fleet-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: connectors/vnc-cli/go.mod
          cache: false
      - name: Start the servers
        run: docker compose -p "$VNC_FLEET_PROJECT" -f fleet/docker-compose.yml up -d --build --wait
      - name: Run the fleet tests
        run: go test -p 1 -tags fleet -count=1 ./...
      - name: Show the server logs
        if: failure()
        run: docker compose -p "$VNC_FLEET_PROJECT" -f fleet/docker-compose.yml logs --tail 200
      # The servers write their certificates as root into fleet/, so a
      # container removes them. Else the next checkout cannot clean.
      - name: Stop the servers
        if: always()
        run: |
          docker compose -p "$VNC_FLEET_PROJECT" -f fleet/docker-compose.yml down -v --remove-orphans
          docker run --rm --entrypoint rm -v "$PWD/fleet:/fleet" vnc-cli-fleet-tigervnc:dev \
            -rf /fleet/vencrypt-certs /fleet/qemu-tls /fleet/wayvnc-certs || true
