name: catalog

on:
  pull_request:
    paths:
      - "catalog/**"
      - "schema/**"
      - "connectors/**"
      - "tools/catalogctl/**"
      - "scripts/validate.sh"
      - "scripts/publish.sh"
      - ".github/workflows/catalog.yml"
  push:
    branches: [main]
    paths:
      - "catalog/**"
      - "schema/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/catalogctl/go.mod
          cache: false
      - name: Test catalogctl
        working-directory: tools/catalogctl
        run: GOWORK=off go test ./...
      - name: Validate the entries
        run: scripts/validate.sh --check-assets

  conformance:
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    env:
      HAS_APP_KEY: ${{ secrets.GH_APP_SECRET != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false
      # trebi is private now, so the release download needs an app token. A
      # fork PR gets no secrets: it tries the public download, and skips the
      # check when that fails. A maintainer then runs it before the merge.
      - name: Get a token for the trebi releases
        id: app
        if: env.HAS_APP_KEY == 'true'
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: "Iv23liHamBzMshOMTWIG"
          private-key: ${{ secrets.GH_APP_SECRET }}
          owner: trebi-ai
          repositories: trebi
          permission-contents: read
      - name: Install trebi
        id: trebi
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          repo=https://github.com/trebi-ai/trebi
          dir="$RUNNER_TEMP/trebi"
          rm -rf "$dir" && mkdir -p "$dir"
          if [ -n "$GH_TOKEN" ]; then
            tag="$(gh release view -R trebi-ai/trebi --json tagName -q .tagName)"
            asset="trebi_${tag#v}_linux_amd64.tar.gz"
            gh release download "$tag" -R trebi-ai/trebi -D "$dir" -p "$asset" -p SHA256SUMS
          else
            if ! tag="$(curl -fsSLI -o /dev/null -w '%{url_effective}' "$repo/releases/latest")"; then
              echo "::notice::The trebi release is not public and this run has no GH_APP_SECRET. The conformance check is skipped. A maintainer runs it before the merge."
              echo "installed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            tag="${tag##*/}"
            asset="trebi_${tag#v}_linux_amd64.tar.gz"
            for f in "$asset" SHA256SUMS; do
              curl -fsSL --retry 3 -o "$dir/$f" "$repo/releases/download/$tag/$f"
            done
          fi
          (cd "$dir" && grep -E "[[:space:]]\*?${asset}\$" SHA256SUMS | sha256sum -c -)
          tar -xzf "$dir/$asset" -C "$dir"
          bin="$(find "$dir" -type f -name trebi | head -n 1)"
          [ -n "$bin" ] || { echo "::error::$asset has no trebi program"; exit 1; }
          chmod +x "$bin"
          echo "$(dirname "$bin")" >> "$GITHUB_PATH"
          echo "installed=true" >> "$GITHUB_OUTPUT"
          echo "trebi $tag"
      - name: Run the conformance checks on each entry
        if: steps.trebi.outputs.installed == 'true'
        run: scripts/validate.sh --conformance

  # Lists the program archives of each install.catalog entry whose version
  # the published index does not have yet.
  plan:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    outputs:
      builds: ${{ steps.pending.outputs.builds }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/catalogctl/go.mod
          cache: false
      - id: pending
        working-directory: tools/catalogctl
        run: |
          # Before the first publish there is no index, so every version is new.
          # publish.sh reads the bucket again and keeps what is published.
          curl -fsS --max-time 30 -o "$RUNNER_TEMP/previous.json" https://catalog.trebi.ai/v1/index.json \
            || : > "$RUNNER_TEMP/previous.json"
          builds="$(GOWORK=off go run . pending --root ../.. --previous "$RUNNER_TEMP/previous.json")"
          echo "$builds"
          echo "builds=$builds" >> "$GITHUB_OUTPUT"

  # Builds one archive. The Linux host builds linux/amd64 and cross-compiles
  # linux/arm64 with aarch64-linux-gnu-gcc. The Mac builds darwin/arm64 and
  # cross-compiles darwin/amd64 with Apple clang. The Linux host has glibc
  # 2.31, so the programs also run on older distributions.
  build:
    needs: plan
    if: needs.plan.outputs.builds != '[]'
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    runs-on: ${{ matrix.os == 'darwin' && fromJSON('["self-hosted","macOS","ARM64"]') || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 20
    env:
      GOOS: ${{ matrix.os }}
      GOARCH: ${{ matrix.arch }}
      CC: ${{ matrix.os == 'linux' && matrix.arch == 'arm64' && 'aarch64-linux-gnu-gcc' || '' }}
      # The OAuth app ids of the device logins. Empty builds need a token.
      TREBI_GITHUB_CLIENT_ID: ${{ vars.TREBI_GITHUB_CLIENT_ID }}
      MSTODO_CLIENT_ID: ${{ vars.MSTODO_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: connectors/${{ matrix.bin }}/go.mod
          cache: false
      - name: Build
        run: |
          connectors/${{ matrix.bin }}/scripts/build.sh "${{ matrix.version }}" "work/${{ matrix.bin }}"
          file "work/${{ matrix.bin }}"
          # The Linux host cannot run an arm64 program. The Mac runs amd64 through Rosetta.
          if [ "${{ matrix.os }}/${{ matrix.arch }}" != linux/arm64 ]; then
            work/${{ matrix.bin }} --version | grep -F "${{ matrix.version }}"
          fi
          mkdir -p "out/${{ matrix.name }}"
          tar -czf "out/${{ matrix.name }}/${{ matrix.bin }}_${{ matrix.os }}_${{ matrix.arch }}.tar.gz" -C work "${{ matrix.bin }}"
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.name }}-${{ matrix.os }}-${{ matrix.arch }}
          path: out/
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: [validate, plan, build]
    if: >-
      !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      needs.validate.result == 'success' && needs.plan.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    environment: catalog-publish
    concurrency:
      group: catalog-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/catalogctl/go.mod
          cache: false
      # The self-hosted runner has no AWS CLI. R2 speaks the S3 API.
      - name: Install the AWS CLI
        run: |
          if ! command -v aws >/dev/null; then
            dir="$RUNNER_TOOL_CACHE/awscli"
            if [ ! -x "$dir/bin/aws" ]; then
              curl -fsSL -o "$RUNNER_TEMP/awscli.zip" https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
              unzip -q -o "$RUNNER_TEMP/awscli.zip" -d "$RUNNER_TEMP"
              "$RUNNER_TEMP/aws/install" --install-dir "$dir/dist" --bin-dir "$dir/bin" --update
            fi
            echo "$dir/bin" >> "$GITHUB_PATH"
          fi
      - uses: actions/download-artifact@v4
        if: needs.build.result == 'success'
        with:
          pattern: bin-*
          path: bin/
          merge-multiple: true
      - name: Publish to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
          BIN_DIR: ${{ github.workspace }}/bin
        run: scripts/publish.sh
