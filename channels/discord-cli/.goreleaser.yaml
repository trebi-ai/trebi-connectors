# Built by .github/workflows/channel-release.yml for tags channels/discord-cli/v*.
version: 2

project_name: discord-cli

builds:
  - id: discord-cli
    main: .
    binary: discord-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [darwin, linux]
    goarch: [amd64, arm64]

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - SKILL.md

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

release:
  disable: true

changelog:
  disable: true
